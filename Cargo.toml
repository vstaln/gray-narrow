[package]
name = "gray-narrow"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "capability narrowing for delegated gray children (pi-daddy port)"

[lib]
name = "gray_narrow"
path = "src/lib.rs"

[[bin]]
name = "gray-narrow"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
strip = true
